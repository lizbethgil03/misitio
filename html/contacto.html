<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <!-- Enlace a Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <!-- SEO -->
    <meta name="keywords" content="Lizbeth Gil, Formulario de contacto, Enviar mensaje, Redes sociales, LinkedIn lizbeth-gil, Instagram @lizbethgilart, Behance lizbethgil, Marca personal, Portafolio digital, Diseño de comunicación, Comunicación visual, Conexión profesional, Creatividad, Servicios profesionales">
    <!-- Meta description -->
    <meta name="description" content="Ponte en contacto con Lizbeth Gil para explorar servicios de diseño de comunicación y creatividad. Completa el formulario para enviar un mensaje y conectar a través de redes sociales como LinkedIn, Instagram y Behance.">
    <!-- Meta phone -->
    <meta name="telephone" content="+598 123 456 789">
    <!-- Meta author -->
    <meta name="author" content="Lizbeth Gil">
    <!-- Meta geo -->
    <meta name="geo.placename" content="Montevideo - Uruguay">
    <!-- FAVICON -->
    <link rel="shortcut icon" href="../assets/logo-icono.png" type="image/x-icon">   
</head>
<body>

    <!-- Header con navegación -->
    <header>
        <div class="container">
            <!-- Logo de la marca -->
            <div class="logo-marca-menu">
                <a href="../index.html">
                    <img src="../assets/logo-marca.png" alt="Logo de la marca menú Lizbeth Gil" class="img-fluid">
                </a>
            </div>
            
            <!-- Menú hamburguesa -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-icon">&#9776;</label>

            <nav>
                <ul class="menu">
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="sobre-nosotros.html">Sobre Nosotros</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Sección Contacto -->
    <section id="contacto">
        <div class="container">
            <h1 class="titulo">Conversemos</h1>
        </div>
    </section>

    <!-- Formulario de contacto -->
    <section id="formulario-contacto">
        <div class="container">
            <div class="row">
                <form action="/enviar-datos" method="post" name="formulario">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre"/>
                    </div>

                    <div class="form-group">
                        <label for="mail">Email:</label>
                        <input type="email" id="mail" name="email"/>
                    </div>

                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje"></textarea>
                    </div>

                    <div class="form-group">
                        <input type="submit" value="Enviar"/>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer con logo y enlaces a redes sociales -->
    <footer>
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Logo de la marca -->
            <div class="logo-marca">
                <a href="../index.html" target="_self">
                    <img src="../assets/logo-marca.png" alt="Logo de la marca Lizbeth Gil" class="img-fluid">
                </a>
            </div>

            <!-- Logos de redes sociales -->
            <div class="redes-sociales">
                <a href="https://www.linkedin.com" target="_blank">
                    <img src="../assets/linkedin-logo.png" alt="Logo LinkedIn" class="img-fluid">
                </a>
                <a href="https://www.instagram.com" target="_blank">
                    <img src="../assets/instagram-logo.png" alt="Logo Instagram" class="img-fluid">
                </a>
                <a href="https://www.behance.net" target="_blank">
                    <img src="../assets/behance-logo.png" alt="Logo Behance" class="img-fluid">
                </a>
            </div>
        </div>
    </footer>

    <!-- Script de Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
